<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بورتفوليو</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c27;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --accent3: #43e97b;
      --text: #e8e8f0;
      --text-dim: #8888aa;
      --border: #2a2a3d;
      --radius: 12px;
      --font-ar: 'Cairo', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ar);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Noise Texture Overlay ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: .5;
    }

    /* ─── Cursor Glow ─── */
    #cursor-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(108,99,255,.08) 0%, transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1;
      transition: opacity .3s;
    }

    /* ─── NAV ─── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10,10,15,.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: var(--font-mono);
      font-size: .95rem;
      color: var(--accent);
      letter-spacing: 2px;
    }

    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: .9rem;
      font-weight: 600;
      transition: color .2s;
      position: relative;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px; right: 0;
      width: 0; height: 2px;
      background: var(--accent);
      transition: width .3s;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a:hover::after { width: 100%; }

    /* ─── HERO ─── */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 8rem 2rem 4rem;
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
    }

    .hero-content { max-width: 700px; }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: rgba(108,99,255,.12);
      border: 1px solid rgba(108,99,255,.3);
      color: var(--accent);
      font-size: .8rem;
      font-family: var(--font-mono);
      padding: .4rem 1rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      animation: fadeInDown .6s ease both;
    }

    .hero-badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent3);
      animation: pulse 2s infinite;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 1rem;
      animation: fadeInDown .7s .1s ease both;
    }

    .hero h1 span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-title-sub {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: var(--text-dim);
      font-weight: 400;
      margin-bottom: 1.5rem;
      animation: fadeInDown .7s .2s ease both;
    }

    .hero-bio {
      font-size: 1.05rem;
      line-height: 1.9;
      color: var(--text-dim);
      max-width: 560px;
      margin-bottom: 2.5rem;
      animation: fadeInDown .7s .3s ease both;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      animation: fadeInDown .7s .4s ease both;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .8rem 1.8rem;
      border-radius: var(--radius);
      font-family: var(--font-ar);
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all .25s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
    }
    .btn-primary:hover {
      background: #7c74ff;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(108,99,255,.4);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .hero-avatar {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 220px; height: 220px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--border);
      box-shadow: 0 0 60px rgba(108,99,255,.2);
      animation: fadeIn .8s .5s both;
      display: none;
    }
    .hero-avatar img { width: 100%; height: 100%; object-fit: cover; }

    @media (min-width: 900px) {
      .hero-avatar { display: block; }
      .hero { justify-content: space-between; }
      .hero-content { max-width: 600px; }
    }

    /* ─── SECTION ─── */
    section {
      padding: 5rem 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 3rem;
    }

    .section-tag {
      font-family: var(--font-mono);
      font-size: .75rem;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .section-title {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 900;
    }

    .divider {
      flex: 1;
      height: 1px;
      background: linear-gradient(to left, transparent, var(--border));
    }

    /* ─── SKILLS ─── */
    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
    }

    .skill-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .5rem 1.2rem;
      border-radius: 999px;
      font-size: .88rem;
      font-weight: 600;
      transition: all .2s;
      cursor: default;
    }
    .skill-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(108,99,255,.1);
    }

    /* ─── PROJECTS ─── */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: all .3s;
      position: relative;
      overflow: hidden;
    }

    .project-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(108,99,255,.06), transparent);
      opacity: 0;
      transition: opacity .3s;
    }

    .project-card:hover {
      border-color: rgba(108,99,255,.4);
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,.3);
    }
    .project-card:hover::before { opacity: 1; }

    .project-card.featured {
      border-color: rgba(108,99,255,.25);
    }

    .project-featured-badge {
      position: absolute;
      top: 1rem; left: 1rem;
      background: rgba(108,99,255,.2);
      color: var(--accent);
      font-size: .7rem;
      font-family: var(--font-mono);
      padding: .2rem .6rem;
      border-radius: 999px;
      border: 1px solid rgba(108,99,255,.3);
    }

    .project-card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-top: .5rem;
    }

    .project-card p {
      color: var(--text-dim);
      font-size: .9rem;
      line-height: 1.7;
      flex: 1;
    }

    .project-tech {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
    }

    .tech-tag {
      background: var(--surface2);
      color: var(--text-dim);
      font-size: .75rem;
      font-family: var(--font-mono);
      padding: .25rem .7rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .project-links {
      display: flex;
      gap: .75rem;
    }

    .project-link {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      color: var(--text-dim);
      text-decoration: none;
      font-size: .85rem;
      font-weight: 600;
      transition: color .2s;
    }
    .project-link:hover { color: var(--accent); }

    /* ─── CONTACT ─── */
    .contact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .contact-card::before {
      content: '';
      position: absolute;
      top: -80px; left: 50%;
      transform: translateX(-50%);
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(108,99,255,.12) 0%, transparent 70%);
    }

    .contact-card h3 {
      font-size: 1.8rem;
      font-weight: 900;
      margin-bottom: .75rem;
    }

    .contact-card p {
      color: var(--text-dim);
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    .contact-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .7rem 1.4rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: .9rem;
      font-weight: 600;
      transition: all .2s;
      background: var(--surface2);
    }
    .contact-link:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* ─── FOOTER ─── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem;
      text-align: center;
      color: var(--text-dim);
      font-size: .85rem;
    }

    footer a { color: var(--accent); text-decoration: none; }

    /* ─── LOADER ─── */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity .5s;
    }

    .loader-ring {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    .fade-in {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity .6s ease, transform .6s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: none;
    }

    /* ─── MOBILE NAV ─── */
    .nav-toggle { display: none; background: none; border: none; cursor: pointer; }

    @media (max-width: 650px) {
      nav { padding: 1rem 1.5rem; }
      .nav-toggle {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .nav-toggle span {
        display: block;
        width: 22px; height: 2px;
        background: var(--text);
        border-radius: 2px;
        transition: .3s;
      }
      .nav-links {
        position: fixed;
        top: 60px; left: 0; right: 0;
        background: var(--surface);
        flex-direction: column;
        align-items: center;
        padding: 1.5rem;
        gap: 1.5rem;
        border-bottom: 1px solid var(--border);
        transform: translateY(-110%);
        transition: transform .3s ease;
        z-index: 99;
      }
      .nav-links.open { transform: none; }
      .hero { padding-top: 6rem; }
      .contact-card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

<div id="loader"><div class="loader-ring"></div></div>
<div id="cursor-glow"></div>

<!-- NAV -->
<nav>
  <span class="nav-logo" id="nav-name">{ portfolio }</span>
  <button class="nav-toggle" id="nav-toggle" aria-label="القائمة">
    <span></span><span></span><span></span>
  </button>
  <ul class="nav-links" id="nav-links">
    <li><a href="#about">عني</a></li>
    <li><a href="#skills">المهارات</a></li>
    <li><a href="#projects">المشاريع</a></li>
    <li><a href="#contact">التواصل</a></li>
  </ul>
</nav>

<!-- HERO -->
<section class="hero" id="about">
  <div class="hero-content">
    <div class="hero-badge"><span class="dot"></span><span id="hero-badge-text">متاح للعمل</span></div>
    <h1 id="hero-name">جارٍ التحميل…</h1>
    <p class="hero-title-sub" id="hero-title"></p>
    <p class="hero-bio" id="hero-bio"></p>
    <div class="hero-actions">
      <a href="#projects" class="btn btn-primary">استعرض مشاريعي ↓</a>
      <a href="#contact" class="btn btn-ghost">تواصل معي</a>
    </div>
  </div>
  <div class="hero-avatar" id="hero-avatar-wrap">
    <img id="hero-avatar" src="" alt="صورة شخصية" />
  </div>
</section>

<!-- SKILLS -->
<section id="skills" class="fade-in">
  <div class="section-header">
    <span class="section-tag">01</span>
    <h2 class="section-title">المهارات التقنية</h2>
    <div class="divider"></div>
  </div>
  <div class="skills-grid" id="skills-grid"></div>
</section>

<!-- PROJECTS -->
<section id="projects" class="fade-in">
  <div class="section-header">
    <span class="section-tag">02</span>
    <h2 class="section-title">المشاريع</h2>
    <div class="divider"></div>
  </div>
  <div class="projects-grid" id="projects-grid"></div>
</section>

<!-- CONTACT -->
<section id="contact" class="fade-in">
  <div class="section-header">
    <span class="section-tag">03</span>
    <h2 class="section-title">تواصل معي</h2>
    <div class="divider"></div>
  </div>
  <div class="contact-card">
    <h3>لنبني شيئاً رائعاً معاً ✦</h3>
    <p>أنا مفتوح للفرص الجديدة، المشاريع المستقلة، والتعاون الإبداعي.</p>
    <div class="contact-links" id="contact-links"></div>
  </div>
</section>

<footer>
  <p>صُنع بـ ♥ بواسطة <strong id="footer-name">…</strong> · <a href="admin.html">لوحة التحكم</a></p>
</footer>

<script>
  /* ── Cursor glow ── */
  const glow = document.getElementById('cursor-glow');
  document.addEventListener('mousemove', e => {
    glow.style.left = e.clientX + 'px';
    glow.style.top  = e.clientY + 'px';
  });

  /* ── Mobile nav ── */
  document.getElementById('nav-toggle').addEventListener('click', () => {
    document.getElementById('nav-links').classList.toggle('open');
  });

  /* ── Intersection observer for fade-in ── */
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

  /* ── Fetch & render ── */
  async function loadPortfolio() {
    try {
      const res  = await fetch('data.json');
      const data = await res.json();
      renderHero(data.personal);
      renderSkills(data.personal.skills);
      renderProjects(data.projects);
      renderContact(data.personal);
    } catch (err) {
      console.error('خطأ في تحميل البيانات:', err);
    } finally {
      const loader = document.getElementById('loader');
      loader.style.opacity = '0';
      setTimeout(() => loader.remove(), 500);
    }
  }

  function renderHero(p) {
    document.title = p.name + ' | بورتفوليو';
    document.getElementById('nav-name').textContent = `{ ${p.name} }`;
    document.getElementById('hero-name').innerHTML = `مرحباً، أنا <span>${p.name}</span>`;
    document.getElementById('hero-title').textContent = p.title;
    document.getElementById('hero-bio').textContent = p.bio;
    document.getElementById('footer-name').textContent = p.name;
    if (p.avatar) {
      document.getElementById('hero-avatar').src = p.avatar;
      document.getElementById('hero-avatar').alt = p.name;
    }
  }

  function renderSkills(skills) {
    const grid = document.getElementById('skills-grid');
    grid.innerHTML = skills.map(s =>
      `<div class="skill-chip">${s}</div>`
    ).join('');
  }

  function renderProjects(projects) {
    const grid = document.getElementById('projects-grid');
    grid.innerHTML = projects.map(p => `
      <div class="project-card ${p.featured ? 'featured' : ''}">
        ${p.featured ? '<span class="project-featured-badge">⭐ مميز</span>' : ''}
        <h3>${p.title}</h3>
        <p>${p.description}</p>
        <div class="project-tech">
          ${p.tech.map(t => `<span class="tech-tag">${t}</span>`).join('')}
        </div>
        <div class="project-links">
          ${p.github ? `<a href="${p.github}" target="_blank" class="project-link">⌥ GitHub</a>` : ''}
          ${p.live    ? `<a href="${p.live}"   target="_blank" class="project-link">↗ معاينة حية</a>` : ''}
        </div>
      </div>
    `).join('');
  }

  function renderContact(p) {
    const links = [
      p.email    && { label: '✉ البريد الإلكتروني', href: `mailto:${p.email}` },
      p.github   && { label: '⌥ GitHub',            href: p.github },
      p.linkedin && { label: '⬡ LinkedIn',          href: p.linkedin },
    ].filter(Boolean);

    document.getElementById('contact-links').innerHTML = links.map(l =>
      `<a href="${l.href}" target="_blank" class="contact-link">${l.label}</a>`
    ).join('');
  }

  loadPortfolio();
</script>
</body>
</html>
